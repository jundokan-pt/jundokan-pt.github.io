<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"
    aria-labelledby="title desc">
    <title id="title">Jundokan activity plan 2026/2027</title>
    <desc id="desc">A soft activity plan with a timeline for seminars, training and events.</desc>
    <rect width="1600" height="900" fill="#123344" />
    <circle cx="1350" cy="180" r="350" fill="#0eb493" opacity=".12" />
    <circle cx="180" cy="800" r="300" fill="#0feb9e" opacity=".06" />
    <g transform="translate(210 150)" opacity=".9">
        <rect width="1180" height="600" rx="24" fill="#ffffff" opacity=".94" />
        <text x="70" y="90" fill="#062033" font-family="Arial, sans-serif" font-size="42"
            font-weight="700">ACTIVITY PLAN</text>
        <text x="70" y="132" fill="#6a737b" font-family="Arial, sans-serif" font-size="24">Jundokan
            International Portugal / 2026 - 2027</text>
        <line x1="70" y1="205" x2="1110" y2="205" stroke="#d7e1e4" stroke-width="6" />
        <g fill="#0eb493">
            <circle cx="125" cy="205" r="16" />
            <circle cx="355" cy="205" r="16" />
            <circle cx="590" cy="205" r="16" />
            <circle cx="825" cy="205" r="16" />
            <circle cx="1060" cy="205" r="16" />
        </g>
        <g fill="#062033" font-family="Arial, sans-serif" font-size="20" font-weight="700"
            text-anchor="middle">
            <text x="125" y="255">OCT</text>
            <text x="355" y="255">JAN</text>
            <text x="590" y="255">MAR</text>
            <text x="825" y="255">APR</text>
            <text x="1060" y="255">JUN</text>
        </g>
        <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
            <rect x="70" y="315" width="300" height="86" rx="10" fill="#dff7f1" />
            <text x="96" y="350" fill="#0e8d76">National seminar</text>
            <text x="96" y="380" fill="#6a737b" font-size="18">São João da Talha</text>
            <rect x="430" y="315" width="280" height="86" rx="10" fill="#e8f0f5" />
            <text x="456" y="350" fill="#062033">Training seminar</text>
            <text x="456" y="380" fill="#6a737b" font-size="18">Rebordosa / Seixal</text>
            <rect x="770" y="315" width="300" height="86" rx="10" fill="#dff7f1" />
            <text x="796" y="350" fill="#0e8d76">Cup and retreat</text>
            <text x="796" y="380" fill="#6a737b" font-size="18">Seixal / Lagos</text>
        </g>
        <g stroke="#d7e1e4" stroke-width="3">
            <line x1="70" y1="475" x2="1110" y2="475" />
            <line x1="70" y1="545" x2="1110" y2="545" />
        </g>
        <text x="70" y="515" fill="#0e8d76" font-family="Arial, sans-serif" font-size="20"
            font-weight="700">PLAN YOUR TRAINING</text>
        <text x="70" y="590" fill="#6a737b" font-family="Arial, sans-serif" font-size="20">Seminars
            / gradings / summer camp / regular dojo training</text>
    </g>
</svg>