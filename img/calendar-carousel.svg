<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Jundokan activity calendar 2026/2027</title>
  <desc id="desc">A teal and navy calendar with highlighted karate training dates.</desc>
  <rect width="1600" height="900" fill="#062033"/>
  <circle cx="1420" cy="110" r="260" fill="#0eb493" opacity=".16"/>
  <circle cx="180" cy="820" r="320" fill="#0feb9e" opacity=".08"/>
  <g transform="translate(280 115)">
    <rect width="1040" height="650" rx="22" fill="#ffffff"/>
    <rect width="1040" height="145" rx="22" fill="#0eb493"/>
    <rect y="112" width="1040" height="33" fill="#0eb493"/>
    <circle cx="90" cy="45" r="14" fill="#ffffff" opacity=".9"/>
    <circle cx="950" cy="45" r="14" fill="#ffffff" opacity=".9"/>
    <text x="520" y="90" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle">2026 / 2027</text>
    <g fill="#647482" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
      <text x="90" y="195">OCT</text><text x="260" y="195">NOV</text><text x="430" y="195">JAN</text><text x="600" y="195">MAR</text><text x="770" y="195">APR</text><text x="940" y="195">JUN</text>
    </g>
    <g fill="#062033" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">
      <text x="90" y="285">17</text><text x="260" y="285">14</text><text x="430" y="285">23</text><text x="600" y="285">6</text><text x="770" y="285">18</text><text x="940" y="285">26</text>
    </g>
    <g fill="#0eb493">
      <circle cx="90" cy="325" r="10"/><circle cx="260" cy="325" r="10"/><circle cx="430" cy="325" r="10"/><circle cx="600" cy="325" r="10"/><circle cx="770" cy="325" r="10"/><circle cx="940" cy="325" r="10"/>
    </g>
    <path d="M90 410h850M90 500h850M90 590h850" stroke="#e6ecef" stroke-width="3"/>
    <g fill="#0feb9e" opacity=".9"><rect x="90" y="390" width="175" height="34" rx="5"/><rect x="430" y="480" width="175" height="34" rx="5"/><rect x="770" y="570" width="175" height="34" rx="5"/></g>
